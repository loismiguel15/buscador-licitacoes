<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alterar Senha - Buscador de Licitações</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/css/global.css">

<style>

body{
background:
radial-gradient(circle at 12% 18%, rgba(43,108,176,0.14), transparent 26%),
radial-gradient(circle at 90% 10%, rgba(96,165,250,0.12), transparent 22%),
linear-gradient(135deg, #f8fbff 0%, #eef3fb 46%, #e8eef7 100%);
font-family:'Inter',sans-serif;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
padding:20px;
color:#132724;
}

.card{
background:linear-gradient(180deg, rgba(255,255,255,0.96), rgba(243,247,243,0.98));
padding:38px 34px;
border-radius:28px;
width:min(460px, 100%);
box-shadow:0 24px 80px rgba(19,39,36,0.12);
border:1px solid rgba(19,39,36,0.10);
}

h2{
margin-bottom:10px;
font-family:'Manrope',sans-serif;
font-size:2rem;
color:#0b2c5f;
letter-spacing:-0.03em;
}

.desc{
color:#5d6c6a;
margin-bottom:24px;
font-size:14px;
line-height:1.6;
}

label{
display:block;
margin-bottom:8px;
font-weight:700;
color:#132724;
}

input{
width:100%;
padding:13px 14px;
margin-bottom:18px;
border:1px solid rgba(19,39,36,0.12);
border-radius:16px;
font-size:15px;
background:rgba(255,255,255,0.92);
}

input:focus{
outline:none;
border-color:#7fa8e6;
box-shadow:0 0 0 4px rgba(43,108,176,0.12);
}

button{
width:100%;
padding:14px;
background:linear-gradient(135deg, #0b2c5f, #163d7a);
color:white;
border:none;
border-radius:16px;
font-size:15px;
font-weight:800;
cursor:pointer;
box-shadow:0 16px 36px rgba(22,58,54,0.22);
}

button:hover{
transform:translateY(-1px);
}

.msg{
margin-top:15px;
padding:12px 14px;
border-radius:14px;
display:none;
font-size:14px;
font-weight:700;
}

.msg.ok{
background:#e9f8ef;
color:#146c43;
}

.msg.err{
background:#fff0f0;
color:#b83232;
}

@media (max-width: 640px){
.card{
padding:28px 20px;
border-radius:22px;
}

h2{
font-size:1.7rem;
}
}

</style>

</head>
<body>

<div class="card">

<h2>Alterar senha</h2>

<p class="desc">
Este é seu primeiro acesso. Por segurança, você precisa definir uma nova senha antes de continuar.
</p>

<form id="formTrocarSenha">

<label>Senha atual</label>
<input type="password" id="senhaAtual" required>

<label>Nova senha</label>
<input type="password" id="novaSenha" required>

<label>Confirmar nova senha</label>
<input type="password" id="confirmarSenha" required>

<button type="submit" id="btnSalvar">Salvar nova senha</button>

</form>

<div id="msg" class="msg"></div>

</div>

<script>

const form = document.getElementById("formTrocarSenha")
const msg = document.getElementById("msg")
const btn = document.getElementById("btnSalvar")

function showMsg(text, ok){
msg.textContent = text
msg.className = "msg " + (ok ? "ok" : "err")
msg.style.display = "block"
}

form.addEventListener("submit", async (e)=>{

e.preventDefault()

msg.style.display="none"

const senhaAtual = document.getElementById("senhaAtual").value
const novaSenha = document.getElementById("novaSenha").value
const confirmarSenha = document.getElementById("confirmarSenha").value

if(!senhaAtual || !novaSenha || !confirmarSenha){
showMsg("Preencha todos os campos.",false)
return
}

if(novaSenha !== confirmarSenha){
showMsg("As senhas não coincidem.",false)
return
}

btn.disabled=true
btn.textContent="Salvando..."

try{

const resp = await fetch("/api/auth/alterar-primeira-senha",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

credentials:"include",

body:JSON.stringify({

senha_atual:senhaAtual,
nova_senha:novaSenha,
confirmar_nova_senha:confirmarSenha

})

})

const data = await resp.json().catch(()=>({}))

if(!resp.ok){

showMsg(data.error || "Erro ao alterar senha.",false)
btn.disabled=false
btn.textContent="Salvar nova senha"
return

}

showMsg(data.message || "Senha alterada com sucesso!",true)

setTimeout(()=>{

window.location.href="/licitacoes_encontradas"

},900)

}catch(err){

showMsg("Erro de conexão com o servidor.",false)

btn.disabled=false
btn.textContent="Salvar nova senha"

}

})

</script>

</body>
</html>
