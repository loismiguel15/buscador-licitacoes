<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alterar Senha - Buscador de Licitações</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/css/global.css">

<style>

body{
background:#f5f7fb;
font-family:'Inter',sans-serif;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.card{
background:white;
padding:40px;
border-radius:12px;
width:420px;
box-shadow:0 8px 30px rgba(0,0,0,0.1);
}

h2{
margin-bottom:10px;
font-family:'Manrope',sans-serif;
}

.desc{
color:#666;
margin-bottom:25px;
font-size:14px;
}

label{
display:block;
margin-bottom:6px;
font-weight:500;
}

input{
width:100%;
padding:10px;
margin-bottom:18px;
border:1px solid #ddd;
border-radius:6px;
font-size:14px;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
font-size:15px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.msg{
margin-top:15px;
padding:10px;
border-radius:6px;
display:none;
font-size:14px;
}

.msg.ok{
background:#e6fffa;
color:#065f46;
}

.msg.err{
background:#fee2e2;
color:#991b1b;
}

</style>

</head>
<body>

<div class="card">

<h2>Alterar senha</h2>

<p class="desc">
Este é seu primeiro acesso. Por segurança, você precisa definir uma nova senha antes de continuar.
</p>

<form id="formTrocarSenha">

<label>Senha atual</label>
<input type="password" id="senhaAtual" required>

<label>Nova senha</label>
<input type="password" id="novaSenha" required>

<label>Confirmar nova senha</label>
<input type="password" id="confirmarSenha" required>

<button type="submit" id="btnSalvar">Salvar nova senha</button>

</form>

<div id="msg" class="msg"></div>

</div>

<script>

const form = document.getElementById("formTrocarSenha")
const msg = document.getElementById("msg")
const btn = document.getElementById("btnSalvar")

function showMsg(text, ok){
msg.textContent = text
msg.className = "msg " + (ok ? "ok" : "err")
msg.style.display = "block"
}

form.addEventListener("submit", async (e)=>{

e.preventDefault()

msg.style.display="none"

const senhaAtual = document.getElementById("senhaAtual").value
const novaSenha = document.getElementById("novaSenha").value
const confirmarSenha = document.getElementById("confirmarSenha").value

if(!senhaAtual || !novaSenha || !confirmarSenha){
showMsg("Preencha todos os campos.",false)
return
}

if(novaSenha !== confirmarSenha){
showMsg("As senhas não coincidem.",false)
return
}

btn.disabled=true
btn.textContent="Salvando..."

try{

const resp = await fetch("/api/auth/alterar-primeira-senha",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

credentials:"include",

body:JSON.stringify({

senha_atual:senhaAtual,
nova_senha:novaSenha,
confirmar_nova_senha:confirmarSenha

})

})

const data = await resp.json().catch(()=>({}))

if(!resp.ok){

showMsg(data.error || "Erro ao alterar senha.",false)
btn.disabled=false
btn.textContent="Salvar nova senha"
return

}

showMsg(data.message || "Senha alterada com sucesso!",true)

setTimeout(()=>{

window.location.href="/licitacoes_encontradas"

},900)

}catch(err){

showMsg("Erro de conexão com o servidor.",false)

btn.disabled=false
btn.textContent="Salvar nova senha"

}

})

</script>

</body>
</html>
